name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cube engine self-test (move tables, facelet round-trip, validation)
        run: node cube.js
      - name: Solver self-test (solves 2000 random scrambles)
        run: node solver.js
